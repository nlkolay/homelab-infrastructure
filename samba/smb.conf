# Эталонная конфигурация для хоста Proxmox: включены параметры ядра для снижения задержек на гигабитной сети (TCP_NODELAY), 
# маски прав 0777 для бесконфликтной записи из Windows и Docker.
[global]
   workgroup = WORKGROUP
   server string = Ryzen Storage Node
   server role = standalone server
   security = user
   map to guest = Bad User
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000

   # Тюнинг производительности сокетов под гигабитный интерфейс
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
   use sendfile = yes
   aio read size = 16384
   aio write size = 16384
   min receivefile size = 16384

   # Протоколы и совместимость
   server min protocol = SMB2_10
   client max protocol = SMB3
   client ipc min protocol = SMB2_10

   # Модули расширения для Windows и macOS
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = Macmini
   fruit:posix_open = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[Media-Storage]
   comment = MergerFS High-Capacity Cold Storage Pool
   path = /mnt/media_pool
   browseable = yes
   read only = no
   guest ok = no
   create mask = 0777
   directory mask = 0777
   force user = root
   force group = root
   veto files = /._*/.DS_Store/.Trashes/
   delete veto files = yes

[Downloads-Temp]
   comment = Fast Scratch Space for Torrents (Separate Drive)
   path = /mnt/disk_trash
   browseable = yes
   read only = no
   guest ok = no
   create mask = 0777
   directory mask = 0777
   force user = root
   force group = root

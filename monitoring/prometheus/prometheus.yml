global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики операционной системы хоста (CPU, память, диск, сеть)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Метрики производительности Docker-контейнеров
  - job_name: "cadvisor"
    static_configs:
      - targets: ["127.0.0.1:8085"]

  # Аппаратный S.M.A.R.T. физических накопителей (температуры, переназначенные секторы)
  - job_name: "smartctl"
    static_configs:
      - targets: ["127.0.0.1:9902"]

  # Метрики доступности внешних сервисов из Uptime Kuma
  - job_name: "uptime-kuma"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:3001"]

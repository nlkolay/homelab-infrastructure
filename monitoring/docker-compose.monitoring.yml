version: "3.8"

services:
  # ==========================================================
  # METRICS & OBSERVABILITY (Prometheus Ecosystem)
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    environment:
      - TZ=Europe/Moscow

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    network_mode: host
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)"
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    network_mode: host
    restart: unless-stopped
    command:
      - "--port=8085"
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    network_mode: host
    restart: unless-stopped
    privileged: true
    command:
      - "--smartctl.interval=60s"
      - "--web.listen-address=0.0.0.0:9902"
    volumes:
      - /dev:/dev:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    network_mode: host
    restart: unless-stopped
    environment:
      - GF_SERVER_HTTP_PORT=3030
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=InitialAdminPassword2026!
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Europe/Moscow
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  # ==========================================================
  # CENTRALIZED LOGGING (OpenSearch Engine + Fluent Bit)
  # ==========================================================
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    network_mode: host
    restart: unless-stopped
    environment:
      - cluster.name=homelab-logs
      - node.name=pve-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Выделение строго 1.5 ГБ под Java Virtual Machine Heap
      - "OPENSEARCH_JAVA_OPTS=-Xms1536m -Xmx1536m"
      # Отключение тяжелых энтерпрайз-плагинов безопасности для локальной сети
      - plugins.security.disabled=true
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    network_mode: host
    restart: unless-stopped
    environment:
      - 'OPENSEARCH_HOSTS=["http://127.0.0.1:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_PORT=5601
      - TZ=Europe/Moscow
    depends_on:
      - opensearch

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

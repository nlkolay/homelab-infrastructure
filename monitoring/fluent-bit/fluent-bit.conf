[SERVICE]
    Flush         2
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

# 1. Прием логов по сети (Syslog от маршрутизатора OpenWrt и гипервизора Proxmox)
[INPUT]
    Name          syslog
    Format        rfc3164
    Mode          udp
    Port          5140
    Listen        0.0.0.0
    Tag           network.syslog

# 2. Чтение логов Docker контейнеров с хоста
[INPUT]
    Name          tail
    Path          /var/lib/docker/containers/*/*-json.log
    Parser        docker
    Tag           docker.*
    Refresh_Interval 5
    Mem_Buf_Limit 50MB
    Skip_Long_Lines On

# 3. HTTP вход для Webhook оповещений от Uptime Kuma
[INPUT]
    Name          http
    Listen        0.0.0.0
    Port          9880
    Tag           kuma.alerts

# Отправка структурированных логов в кластер OpenSearch
[OUTPUT]
    Name          opensearch
    Match         *
    Host          127.0.0.1
    Port          9200
    Index         homelab-logs
    Type          _doc
    Logstash_Format On
    Logstash_Prefix homelab
    Retry_Limit   5
